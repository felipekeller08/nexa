<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nexa • Header Mobile</title>
  <link rel="stylesheet" href="styles/principal.css">
</head>
<body>
  <!-- HEADER -->
<header class="app-header" role="banner">
  <button class="btn-icon hamburger" aria-label="Abrir menu" aria-expanded="false" aria-controls="mobile-menu">
    <span class="hamburger-box"><span class="hamburger-inner"></span></span>
  </button>
  <div class="descricao-pagina">
  <a class="brand" href="#" aria-label="Nexa – início">
    <img class="brand-logo" src="img/logo.png" alt="Nexa" />
  </a>
<p>Estudos</p>
</div>
  <button class="btn-icon profile" aria-label="Perfil">
    <svg viewBox="0 0 24 24" class="icon" aria-hidden="true">
      <circle cx="12" cy="8" r="4" fill="none" stroke="white" stroke-width="2"/>
      <path d="M4 20a8 8 0 0 1 16 0" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"/>
    </svg>
  </button>
</header>
  <nav id="mobile-menu" class="side-menu" aria-hidden="true">
    <div class="menu-header">
      <button class="btn-icon close" aria-label="Fechar menu">
        <svg viewBox="0 0 24 24" class="icon" aria-hidden="true">
          <path d="M6 6l12 12M18 6L6 18" stroke="white" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
      <span class="menu-title">Menu</span>
    </div>
 <ul class="menu-list" role="menu">
      <li role="none"><a role="menuitem" href="../index.html" data-nav="home">Home</a></li>
      <li role="none"><a role="menuitem" href="../estudos/index.html" data-nav="study">Estudos</a></li>
      <li role="none"><a role="menuitem" href="../tarefas/index.html" data-nav="tasks">Hábitos e Tarefas</a></li>
      <li role="none"><a role="menuitem" href="../compras/index.html" data-nav="shopping">Compras</a></li>
      <li role="none"><a role="menuitem" href="../finanças/index.html" data-nav="finance">Finanças</a></li>
    </ul>
  </nav>
  <div class="backdrop" hidden></div>
  <!------------------------------------- HEADER ---------------------------------->



  <!------------------------------------- CONTEUDO DA PÁGINA---------------------------------->
<main>
        <main>
            <!-- Linha com cards de entrada -->
            <div class="card-row">
                <div class="card">
                    <h1>ESTUDOS</h1>
                    <input type="text" placeholder="O que vai estudar hoje?" id="estudo"><br><br>
                    <p>Quando irá começar:</p>
                    <input type="date" id="comeco-estudo"><br><br>
                    <p>Quando irá terminar:</p>
                    <input type="date" id="final-estudo">
                    <button class="btn-salvar" id="btn-salvar-estudo">Salvar</button>
                </div>

                <div class="card">
                    <h1>METAS</h1>
                    <input type="text" placeholder="Qual sua meta?" id="meta"><br><br>
                    <p>Quando irá começar:</p>
                    <input type="date" id="comeco-meta"><br><br>
                    <p>Quando irá terminar:</p>
                    <input type="date" id="final-meta"><br><br>
                    <button class="btn-salvar" id="btn-salvar-meta">Salvar</button>
                </div>
            </div>

            <!-- Linha com cards gerados -->
            <div class="card-row">
                <div class="card">
                    <h1>SEUS ESTUDOS</h1>
                    <div id="estudos-area"></div>
                </div>

                <div class="card">
                    <h1>SUAS METAS</h1>
                    <div id="metas-area"></div>
                </div>
            </div>
        </main>


    </main>
  <!------------------------------------- CONTEUDO DA PÁGINA---------------------------------->





  <!-----SCRIPT DO HEADER-->
  <script src="scripts/script.js"></script>
  <!-----SCRIPT DO HEADER-->

  <!-----SCRIPTS DA PÁGINA-->
    <script src="scripts/estudos.js"></script>
    <script src="scripts/metas.js"></script>
  <!----SCRIPTS DA PÁGINA-->
</body>
</html>
